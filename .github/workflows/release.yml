name: Release

# Builds the Windows installer and the Linux AppImage and deb on Linux (no
# Windows machine or wine: the installer is compiled with the bundled NSIS).
# A v* tag attaches them to a draft GitHub release; a manual run keeps them
# as workflow artifacts.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: .NET (hmi-comms)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Windows installer
        run: npm run dist-win

      - name: Linux packages
        # dist-win already built the Windows runtime template the Linux
        # editor ships for HMI > Publish
        run: npm run dist-linux -- --skip-runtime

      - name: Keep the packages
        uses: actions/upload-artifact@v6
        with:
          name: append-hmi-studio
          path: |
            dist/*-Setup.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # A release made by hand from local builds is left alone
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; packages kept as workflow artifacts"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" --draft --title "Append HMI Studio ${GITHUB_REF_NAME#v}" \
            --notes "Windows x64 installer, Linux AppImage and deb." \
            dist/*-Setup.exe dist/*.AppImage dist/*.deb
